name: Sitemap Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-sitemap:
    name: Validate Sitemap and SEO Route Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and validate sitemap
        run: pnpm ci:sitemap
